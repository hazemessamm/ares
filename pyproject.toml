[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ares"
version = "0.1.0"
description = "Protein language modeling components for the Ares project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Hazem Essam" },
]
dependencies = [
  "einops",
  "numpy",
  "tokenizers",
  "torch==2.9.0",
  "transformers==5.15.1",
]

[project.optional-dependencies]
data = [
  "datasets==4.4.2",
  "huggingface-hub",
]
training = [
  "fsspec",
  "gcsfs",
  "hydra-core",
  "omegaconf",
  "requests",
  "tqdm",
  "wandb",
]
evaluation = [
  "accelerate==1.10.1",
  "matplotlib",
  "pandas",
  "scikit-learn",
  "scipy",
]
xla = [
  "torch-xla[tpu]==2.9.0",
]
dev = [
  "pytest",
]
full = [
  "accelerate==1.10.1",
  "datasets==4.4.2",
  "fsspec",
  "gcsfs",
  "huggingface-hub",
  "hydra-core",
  "matplotlib",
  "omegaconf",
  "pandas",
  "requests",
  "scikit-learn",
  "scipy",
  "torch-xla[tpu]==2.9.0",
  "tqdm",
  "wandb",
]

[tool.setuptools.packages.find]
include = ["ares*"]
